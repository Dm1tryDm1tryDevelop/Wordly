function newGame(){if(mode=='d')return toast('Новое слово дня будет завтра');
if(mode=='b')return setMode('b');
g=fresh('c');cur='';busy=false;keep();draw()}

function type(k){if(busy||over()||(mode=='b'&&!g.live))return;
if(k=='Del')cur=cur.slice(0,-1);
else if(k=='Enter')return submit();
else if(/^[a-z]$/.test(k)&&cur.length<5)cur+=k;
clack(1400+Math.random()*600);drawRow(g.guesses.length,cur);
const rc=[...rows[g.guesses.length].children];
if(k!='Del'&&cur.length){const t=rc[cur.length-1];void t.offsetWidth;t.classList.add('pop')}
rc.forEach((t,i)=>t.classList.toggle('n',i==cur.length&&cur.length<5))}

function submit(){const r=rows[g.guesses.length];
if(cur.length<5){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');vib(30);return toast('Не хватает букв')}
if(!/[aeiouy]/.test(cur)){r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');vib(30);return toast('Такого слова нет')}
const w=cur,res=score(w,g.ans);busy=true;
[...r.children].forEach((t,i)=>{t.style.animationDelay=i*.25+'s';t.classList.add('flip');setTimeout(()=>{t.classList.add(res[i]);clack(res[i]=='c'?2200:res[i]=='p'?1700:1200)},i*250+250)});
setTimeout(()=>{g.guesses.push(w);cur='';g.won=w==g.ans;keep();paintKeys();busy=false;const nr=rows[g.guesses.length];if(nr&&!over())nr.children[0].classList.add('n');after()},1500)}

function after(){
if(mode=='b'){if(!g.live)return;
if(g.won){g.sc++;g.t=Math.min(120,g.t+10);toast('+10 с');tone(784,.15)}
else if(over()){g.t=Math.max(0,g.t-15);toast(g.ans.toUpperCase()+'  -15 с');tone(220,.3)}
else return;
if(g.t<=0)return endBlitz();
setTimeout(()=>{if(!g.live)return;const t=g.t,sc=g.sc;g=fresh('b');g.t=t;g.sc=sc;g.live=true;cur='';draw()},700);return}
if(over())finish();else if(g.guesses.length==5)toast('Последняя попытка')}

function finish(){let gain=0;
if(!g.done){g.done=true;st.p++;
if(g.won){st.w++;st.s++;st.m=Math.max(st.m,st.s);st.d[g.guesses.length-1]++;gain=(7-g.guesses.length)*(mode=='d'?2:1);st.c+=gain}else st.s=0;
put(SK,st);keep()}
if(g.won){toast('Верно!  +'+gain+' монет');[523,659,784,1047].forEach((f,i)=>tone(f,.2,i*.1))}else{toast(g.ans.toUpperCase());tone(200,.4);}
draw();setTimeout(()=>stats(),1300)}

function endBlitz(){clearInterval(tmr);g.live=false;const sc=g.sc,nb=sc>st.b;
st.c+=sc;if(nb)st.b=sc;put(SK,st);tone(300,.5);draw();
setTimeout(()=>stats('Блиц: '+sc+' слов'+(nb?' · новый рекорд':'')+' · +'+sc+' монет'),700)}

function reveal(){if(over()||st.c<3)return;const got=new Set();
g.guesses.forEach(w=>[...w].forEach((l,i)=>{if(l==g.ans[i])got.add(i)}));
const free=[0,1,2,3,4].filter(i=>!got.has(i)&&!(i in g.rev));
if(!free.length)return toast('Нечего открывать');
const i=free[Math.random()*free.length|0];g.rev[i]=g.ans[i];st.c-=3;put(SK,st);keep();tone(660);draw()}
function clearKeys(){if(over()||st.c<2)return;const used=new Set(g.guesses.join('')+g.out.join(''));
const pool=[..."abcdefghijklmnopqrstuvwxyz"].filter(l=>!g.ans.includes(l)&&!used.has(l));
if(!pool.length)return toast('Нечего убирать');
for(let n=0;n<5&&pool.length;n++)g.out.push(pool.splice(Math.random()*pool.length|0,1)[0]);
st.c-=2;put(SK,st);keep();tone(440);draw()}

function stats(msg){const mx=Math.max(1,...st.d);
$('#sn').innerHTML=[['Игры',st.p],['Победы %',st.p?Math.round(st.w/st.p*100):0],['Серия',st.s],['Рекорд',st.m],['Блиц',st.b]].map(a=>`<div><b>${a[1]}</b><span>${a[0]}</span></div>`).join('');
$('#sd').innerHTML=st.d.map((n,i)=>`<div class="d"><span>${i+1}</span><i class="${mode!='b'&&g.won&&g.guesses.length==i+1?'h':''}" style="width:${Math.max(8,n/mx*100)}%">${n}</i></div>`).join('');
$('#end').textContent=typeof msg=='string'?msg:(mode!='b'&&over()?(g.won?'Верно: ':'Слово: ')+g.ans.toUpperCase()+' — '+WORDS[g.ans].split('|')[0]:'');
$('#ds').textContent='Звук: '+(st.snd?'вкл':'выкл');
clearInterval(stats.i);
if(mode=='d'&&over()){const base=$('#end').textContent,f=()=>{const ms=864e5-Date.now()%864e5;$('#end').textContent=base+'\nСледующее слово через '+[ms/36e5|0,ms/6e4%60|0,ms/1e3%60|0].map(n=>String(n).padStart(2,'0')).join(':')};f();stats.i=setInterval(()=>dlg.open?f():clearInterval(stats.i),1000)}
if(!dlg.open)dlg.showModal()}

kb.addEventListener('pointerdown',e=>{const b=e.target.closest('.k');if(b){e.preventDefault();type(b.dataset.k)}});
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||dlg.open)return;
const c=e.code,k=c=='Backspace'?'Del':c=='Enter'||c=='NumpadEnter'?'Enter':/^Key[A-Z]$/.test(c)?c[3].toLowerCase():'';if(k)type(k)});
$('#bh').onclick=()=>{if(over())return;g.hint=true;keep();draw()};
$('#pr').onclick=reveal;$('#pc').onclick=clearKeys;
$('#bs').onclick=()=>stats();$('#bn').onclick=newGame;
$('#dc').onclick=()=>dlg.close();$('#dn').onclick=()=>{dlg.close();newGame()};
$('#ds').onclick=()=>{st.snd=st.snd?0:1;put(SK,st);$('#ds').textContent='Звук: '+(st.snd?'вкл':'выкл')};
tabs.forEach(b=>b.onclick=()=>setMode(b.dataset.m));
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350)e.preventDefault();lt=n},{passive:false});document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
function clack(p){if(!st.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate*.05|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const o=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();o.buffer=b;f.type='bandpass';f.frequency.value=p;f.Q.value=1.2;g.gain.value=.6;o.connect(f).connect(g).connect(ac.destination);o.start()}catch(e){}}
let dp=null;const inst=$('#inst'),sm=matchMedia('(display-mode: standalone)'),std=()=>sm.matches||navigator.standalone,ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
function pi(){const on=!std()&&!!(dp||ios);inst.hidden=!on;$('#app').classList.toggle('inst',on)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;pi()});
addEventListener('appinstalled',()=>{dp=null;pi();toast('Приложение установлено')});
inst.onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;pi()}else $('#ios').showModal()};
sm.addEventListener('change',pi);pi();
setMode('c');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body>
</html>
